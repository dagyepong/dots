# cava config for the sekaipop desktop visualizer (VisualizerWidget.qml).
# Raw ASCII on stdout: 24 bands (the widget folds them into the 12 lanes),
# values 0..1000, one line per frame, ';' between bands. Mono on purpose.
[general]
framerate = 60
autosens = 1
bars = 24

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 30
