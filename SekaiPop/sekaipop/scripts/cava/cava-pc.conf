# cava config for the end4-style visualizers (ShaderVisualizerEngine.qml, PcCavaService.qml).
# Same as end4-pC's scripts/cava/raw_output_config.txt: 50 bands, waves mode, mono,
# raw ASCII on stdout (values 0..1000, ';' between bands, one line per frame).
[general]
mode = waves
framerate = 60
autosens = 1
bars = 50

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
channels = mono
mono_option = average

[smoothing]
noise_reduction = 20
