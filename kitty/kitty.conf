# ==============================================================================
# WAYLAND / WINDOW SETTINGS
# ==============================================================================
wayland_titlebar_color        background
remember_window_size          no
initial_width                 940
initial_height                520
window_padding_width          12
placement_strategy            center
hide_window_decorations       yes

# Smooth window behaviors
confirm_os_window_close       0
default_layout                tall

# Subtle background blur (Obsidian Red Theme Alignment)
dynamic_background_opacity      yes
background_opacity              0.85
background_blur                 20

# ==============================================================================
# FONTS & RENDERING
# ==============================================================================
font_size                     10

text_composition_strategy       platform
url_style                     curly
url_color                     #ff5c5c
detect_urls                   yes

symbol_map U+4E00-U+9FFF Zen Kaku Gothic New

# ==============================================================================
# CURSOR & MOUSE
# ==============================================================================
cursor                        #ff3333
cursor_text_color             #0a0505
cursor_shape                  beam
cursor_blink_interval         0.6
cursor_stop_blinking_after    15.0
mouse_hide_wait               3.0

# ==============================================================================
# GLOW RED / OBSIDIAN TERMINAL CUSTOM PALETTE
# ==============================================================================
foreground                    #ff3333
background                    #0a0505
selection_foreground          #ff3333
selection_background          #3a1212

#: The basic 16 colors (Mapped to the Glow Red / Obsidian Terminal theme)

# Black / Dark Tones
color0                        #0a0505
color8                        #991f1f

# Red (Phosphor Red & Bright Highlight)
color1                        #991f1f
color9                        #ff3333

# Green (Terminal Muted / Accent match)
color2                        #339933
color10                       #58ff77

# Yellow / Amber Accents
color3                        #b36b00
color11                       #ffaa00

# Blue Tones
color4                        #3366ff
color12                       #6e8bff

# Magenta Tones
color5                        #993399
color13                       #ff66ff

# Cyan Tones
color6                        #009999
color14                       #66ffff

# White / Light Text Tones
color7                        #cca6a6
color15                       #ffcccc

# ==============================================================================
# PERFORMANCE & INTERACTION
# ==============================================================================
scrollback_lines              10000
enable_audio_bell             no

allow_remote_control          yes
listen_on                     unix:/tmp/kitty
clipboard_control             write-clipboard write-primary read-clipboard read-primary
shell_integration             enabled

# ==============================================================================
# KEYBINDINGS
# ==============================================================================
map ctrl+shift+v              paste_from_clipboard
map ctrl+shift+c              copy_to_clipboard
map ctrl+shift+t              new_tab
map ctrl+shift+w              close_tab
map ctrl+shift+left           neighboring_window left
map ctrl+shift+right          neighboring_window right
map ctrl+shift+up             neighboring_window up
map ctrl+shift+down           neighboring_window down


# BEGIN_KITTY_FONTS
font_family       family="Spleen 16x32"
bold_font         auto
italic_font       auto
bold_italic_font auto
# END_KITTY_FONTS
