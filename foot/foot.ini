[main]
font=monospace:size=9:antialias=true:autohint=true
dpi-aware=no
pad=12x12
term=foot

# Performance & Initial Window
initial-window-size-pixels=900x600
bold-text-in-bright=yes

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=none

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmv
osc8-underline=url-mode

[cursor]
style=block
blink=yes

[colors-dark]
alpha=1.0

# Cursor Color: <text-color-under-cursor> <cursor-fill-color> (Using Srcery cursor text & color)
cursor=121110 fed06e

# Base Colors (Keeping your preferred dark grey background)
foreground=fce8c3
background=5f5a50

# Normal Colors (Srcery Palette)
regular0=121110
regular1=ef2f27
regular2=519f50
regular3=fbb829
regular4=2c78bf
regular5=e02c6d
regular6=0aaeb3
regular7=c5b088

# Bright Colors (Srcery Palette)
bright0=917e6b
bright1=f75341
bright2=98bc37
bright3=fed06e
bright4=68a8e4
bright5=ff5c8f
bright6=2be4d0
bright7=fce8c3

# Extended Palette
16=d0d2cf
17=e2ded4

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert
