[main]
font=monospace:size=9:antialias=true:autohint=true
dpi-aware=no
pad=12x12
term=foot

# Performance & Initial Window
initial-window-size-pixels=900x600
bold-text-in-bright=yes

[csd]
# Client-side decoration settings matching your vim border/split tones
preferred=server
size=26
border-width=2
border-color=e9d0b0
button-width=26
button-minimize-color=afaa99
button-maximize-color=afaa99
button-close-color=ff0000

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=none

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmv
osc8-underline=url-mode

[cursor]
style=block
blink=yes

[colors]
alpha=1.0

# Cursor: text color under cursor, cursor fill color
cursor=f0d8b3 555555

# Parchment colors mapped from your Vim config
foreground=555555
background=f0d8b3

# Normal colors (Mapped from parchment palette variables)
regular0=555555  # s:fg
regular1=ff0000  # s:warning
regular2=61873b  # s:str
regular3=cc7700  # s:func / s:type
regular4=61873b  # s:str variant
regular5=997799  # s:keyword / s:const
regular6=998844  # s:builtin
regular7=afaa99  # s:fg2

# Bright colors (Parchment bright variants & highlights)
bright0=888888  # s:comment
bright1=ff8800  # s:warning2
bright2=61873b  # s:str
bright3=cc7700  # s:type
bright4=61873b  # s:str
bright5=997799  # s:keyword
bright6=998844  # s:builtin
bright7=555555  # s:fg

# Extended colors matching your vim syntax definitions
16=cc7700
17=61873b
18=997799
19=998844

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert
