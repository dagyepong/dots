[main]
font=monospace:size=10
strikeout-thickness=2px
dpi-aware=no
pad=12x12
term=foot

[colors]
alpha=1.0

# Original background and cursor colors
foreground=555555
background=f0d8b3
cursor=f0d8b3 555555

# Normal colors
regular0=555555
regular1=ff71ce
regular2=ff9a9e
regular3=05ffa1
regular4=05ffa1
regular5=ff9a9e
regular6=05ffa1
regular7=b967ff

# Bright colors
bright0=888888
bright1=ff71ce
bright2=ff9a9e
bright3=05ffa1
bright4=05ffa1
bright5=ff9a9e
bright6=05ffa1
bright7=b967ff

# Extended colors
16=ff71ce
17=ff9a9e
18=05ffa1
19=b967ff

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert

