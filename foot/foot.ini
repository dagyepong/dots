[main]
font=monospace:size=9.5:antialias=true:autohint=true
dpi-aware=no
pad=12x12
term=foot

# Performance & Initial Window
initial-window-size-pixels=900x600
bold-text-in-bright=yes

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=none

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmv
osc8-underline=url-mode

[cursor]
style=block
blink=yes

[colors-dark]
alpha=1.0

# Cursor Color: <text-color-under-cursor> <cursor-fill-color>
cursor=e5dfd3 4a5353

# Base Colors
foreground=4a5353
background=e5dfd3

# Normal Colors
regular0=4a5353
regular1=896d6d
regular2=6d896d
regular3=89896d
regular4=6d6d89
regular5=896d89
regular6=6d8989
regular7=726c60

# Bright Colors
bright0=2c3333
bright1=a38989
bright2=89a389
bright3=a3a389
bright4=8989a3
bright5=a389a3
bright6=89a3a3
bright7=302c25

# Extended Palette
16=b3b5b2
17=cccac2
