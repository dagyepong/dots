[main]
font=monospace:size=9:antialias=true:autohint=true
dpi-aware=no
pad=12x12
term=foot

# Performance & Initial Window
initial-window-size-pixels=900x600
bold-text-in-bright=yes

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=none

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmv
osc8-underline=url-mode

[cursor]
style=block
blink=yes

[colors]
alpha=1.0

# Cursor: text color under cursor, cursor fill color
cursor=dfe6e9 b967ff

# Vaporwave colors; background preserved from your original config
foreground=dfe6e9
background=5f5a50

# Normal colors
regular0=121110
regular1=ff71ce
regular2=05ffa1
regular3=01cdfe
regular4=01cdfe
regular5=b967ff
regular6=05ffa1
regular7=ff71ce

# Bright colors
bright0=917e6b
bright1=ff71ce
bright2=05ffa1
bright3=01cdfe
bright4=01cdfe
bright5=b967ff
bright6=05ffa1
bright7=ffffff

# Extended colors from the Vaporwave scheme
16=ff71ce
17=01cdfe
18=05ffa1
19=b967ff

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert

