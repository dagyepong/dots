[main]
font=monospace:size=9:antialias=true:autohint=true
dpi-aware=no
pad=12x12
term=foot

# Performance & Initial Window
initial-window-size-pixels=900x600
bold-text-in-bright=yes

[bell]
urgent=no
notify=no
visual=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=none

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmv
osc8-underline=url-mode

[cursor]
style=block
blink=yes

[colors-dark]
alpha=1.0

# Cursor Color: <text-color-under-cursor> <cursor-fill-color>
cursor=5f5a50 e5dfd3

# Base Colors
foreground=e5dfd3
background=5f5a50

# Normal Colors
regular0=e5dfd3
regular1=b08383
regular2=8eaa8e
regular3=aaa080
regular4=8e96b5
regular5=aa8eaa
regular6=8eaaaa
regular7=c2b9aa

# Bright Colors
bright0=f0ebe1
bright1=c49b9b
bright2=a8c4a8
bright3=c4ba98
bright4=a8b0d0
bright5=c4a8c4
bright6=a8c4c4
bright7=f5eee2

# Extended Palette
16=d0d2cf
17=e2ded4

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert

