# Eight bars is what fits beside a track title. Raw ASCII on stdout is the
# cheapest thing for the shell to read: one line per frame, values 0 to 100.

[general]
framerate = 30
bars = 8
autosens = 1

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100

[smoothing]
noise_reduction = 45
